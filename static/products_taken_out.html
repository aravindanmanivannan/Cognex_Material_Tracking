<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Taken Out</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/products_taken_out')
                .then(response => response.json())
                .then(data => {
                    const products = data.products_out; // Adjusted key based on your API response
                    const tableBody = document.getElementById('product-list');

                    // Check if products are available
                    if (products && products.length > 0) {
                        products.forEach(product => {
                            const row = `
                                <tr>
                                    <td>${product.Employee_ID}</td>
                                    <td>${product.Employee_Name}</td>
                                    <td>${product.CRM_Counter}</td>
                                    <td>${product.Product_Serial_Number}</td>
                                    <td>${product.Status}</td>
                                    <td>${product.out_timestamp}</td>
                                    <td>${product.Employee_Email}</td>
                                    <td>${product.Company_Name}</td>
                                    <td>${product.Preferred_Checkin_Date}</td>
                                </tr>
                            `;
                            tableBody.innerHTML += row;
                        });
                    } else {
                        tableBody.innerHTML = `
                            <tr>
                                <td colspan="9">No products taken out</td>
                            </tr>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error fetching products:', error);
                });
        });
    </script>
    <style>
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: yellow; /* Yellow background */
            padding: 10px; /* Add some padding */
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="header-container mb-4">
            <h2>Products Taken Out</h2>
            <button onclick="window.location.href='/'" >Back to Home</button>
        </div>
        
        <!-- Table to display products taken out -->
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Employee Name</th>
                    <th>CRM Counter</th>
                    <th>Product Serial Number</th>
                    <th>Status</th>
                    <th>Out Timestamp</th>
                    <th>Employee Email</th>
                    <th>Company Name</th>
                    <th>Preferred Checkin Date</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Product rows will be inserted here dynamically -->
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
