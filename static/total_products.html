<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Products</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/total_products')
                .then(response => response.json())
                .then(data => {
                    const products = data.products;
                    const tableBody = document.getElementById('product-list');

                    // Check if products are available
                    if (products && products.length > 0) {
                        products.forEach(product => {
                            const row = `
                                <tr>
                                    <td>${product.Product_Serial_Number}</td>
                                    <td>${product.Product_Description}</td>
                                    <td>${product.Product_Part_Name}</td>
                                </tr>
                            `;
                            tableBody.innerHTML += row;
                        });
                    } else {
                        tableBody.innerHTML = `
                            <tr>
                                <td colspan="3">No products available</td>
                            </tr>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error fetching products:', error);
                });
        });
    </script>
    <style>
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: yellow; /* Yellow background for header */
            padding: 10px; /* Padding for better spacing */
        }

        h2 {
            margin: 0; /* Remove default margin for clean alignment */
        }

        .header-container button {
            margin-left: 10px; /* Space between header and button */
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <!-- Header with a yellow background -->
        <div class="header-container mb-4">
            <h2>Total Products</h2>
            <button onclick="window.location.href='/'" >Back to Home</button>
        </div>
        
        <!-- Table to display products -->
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Serial Number</th>
                    <th>Description</th>
                    <th>Part Name</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Product rows will be inserted here dynamically -->
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
